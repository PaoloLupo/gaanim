# The example catalog. Every script listed here follows the style contract
# that `python scripts/examples.py check` enforces (see AGENTS.md, "Examples"),
# and README.md is generated from this file with `python scripts/examples.py readme`.
#
# A topic is a folder under examples/; topics are listed in reading order.
# An example's topic is the first folder of its `path`. Its fields:
#
#   path         Script path relative to examples/.
#   description  One sentence for the README, the docs gallery and the playground.
#   title        Display name; defaults to the file name in sentence case.
#   web          false when the example cannot run in the web playground
#                (video, Typst Universe packages, system fonts). Default true.
#   allow        Contract rules the example is exempt from because they are its
#                subject: "background", "frame", "margin", "theme", "post",
#                "colors" or "titles".
#   group        A heading of the topic's page the example is listed under;
#                the gallery uses it for its sections.

