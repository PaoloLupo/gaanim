name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build gaanim.exe (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: |
          cargo build -p gaanim_launcher --release --bin gaanim
          cargo build -p gaanim_editor --release --bin gaanim-core

      - name: Build authoring wheel
        run: |
          python -m pip install build hatchling
          python -m build --wheel --no-isolation --outdir target/wheels crates/gaanim_python
          python tests/validate_authoring_wheel.py target/wheels

      - name: Verify version matches tag (if tag push)
        shell: pwsh
        run: |
          $cargoVer = (Select-String -Path crates/gaanim_editor/Cargo.toml -Pattern '^version = "([^"]+)"' | ForEach-Object { $_.Matches.Groups[1].Value } | Select-Object -First 1)
          Write-Host "Cargo version: $cargoVer"
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $tagVer = "${{ github.ref_name }}".TrimStart("v")
            if ($cargoVer -ne $tagVer) {
              Write-Error "Tag $tagVer does not match Cargo version $cargoVer"
              exit 1
            }
          }
          # Launcher should start without python on PATH; core is tested via launcher
          .\target\release\gaanim.exe --help 2>&1 | Out-Host

      - name: Package zip
        shell: pwsh
        run: |
          $ver = (Select-String -Path crates/gaanim_editor/Cargo.toml -Pattern '^version = "([^"]+)"' | ForEach-Object { $_.Matches.Groups[1].Value } | Select-Object -First 1)
          $zipName = "gaanim-v$ver-windows-x64.zip"
          $stage = "dist/stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/gaanim.exe "$stage/gaanim.exe"
          Copy-Item target/release/gaanim-core.exe "$stage/gaanim-core.exe"
          Copy-Item target/wheels/gaanim-*-py3-none-any.whl "$stage/"
          if (Test-Path README.md) { Copy-Item README.md "$stage/" }
          @"
          Gaanim $ver — Windows x64
          
          Requisitos: Python >=3.12 (3.12 minimo, 3.14 tambien soportado) instalado via python.org / winget install Python.Python.3.12
          Instalacion:
            1. Extrae el zip a C:\Tools\gaanim\ o donde prefieras.
            2. Añade esa carpeta a PATH (Panel > Sistema > Variables de entorno).
            3. Verifica: gaanim --help  (launcher detecta automaticamente .venv sin necesidad de PATH/VIRTUAL_ENV)
          
          Contenido: gaanim.exe + gaanim-core.exe + wheel ligero para autocompletado
          Uso con uv (recomendado, creas proyectos manualmente):
            uv venv --python 3.12
            .\.venv\Scripts\Activate.ps1
            # Gaanim crea .venv e instala automáticamente el wheel de autocompletado.
            gaanim                    # Inicio: crear, abrir y ver recientes
            gaanim init video my_proj
            gaanim init slides my_deck
            gaanim my_proj
          
          Sin activar venv, gaanim.exe detecta automaticamente .venv/venv cercano (walk-up desde script/cwd/exe) o Python del sistema (py launcher / where python).
          "@ | Out-File -FilePath "$stage/README.txt" -Encoding utf8
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$zipName" -Force
          Get-ChildItem dist | Format-Table Name, Length
          # checksum
          $hash = (Get-FileHash "dist/$zipName" -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "dist/$zipName.sha256" -Encoding utf8
          Write-Host "SHA256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaanim-windows-x64
          path: |
            dist/gaanim-v*-windows-x64.zip
            dist/gaanim-v*-windows-x64.zip.sha256

  release-linux:
    name: Build gaanim (Ubuntu x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: |
          cargo build -p gaanim_launcher --release --bin gaanim
          cargo build -p gaanim_editor --release --bin gaanim-core

      - name: Build authoring wheel
        run: |
          python -m pip install build hatchling
          python -m build --wheel --no-isolation --outdir target/wheels crates/gaanim_python
          python tests/validate_authoring_wheel.py target/wheels

      - name: Verify version and launcher
        run: |
          cargo_ver=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/gaanim_editor/Cargo.toml | head -n 1)
          echo "Cargo version: $cargo_ver"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            test "v$cargo_ver" = "${{ github.ref_name }}"
          fi
          target/release/gaanim --help

      - name: Package tarball
        run: |
          ver=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/gaanim_editor/Cargo.toml | head -n 1)
          archive="gaanim-v$ver-linux-x64.tar.gz"
          stage="dist/stage"
          mkdir -p "$stage"
          install -m 755 target/release/gaanim target/release/gaanim-core "$stage/"
          install -m 644 target/wheels/gaanim-*-py3-none-any.whl README.md "$stage/"
          tar -C "$stage" -czf "dist/$archive" .
          (cd dist && sha256sum "$archive" > "$archive.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gaanim-linux-x64
          path: |
            dist/gaanim-v*-linux-x64.tar.gz
            dist/gaanim-v*-linux-x64.tar.gz.sha256

  publish:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release-windows, release-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
