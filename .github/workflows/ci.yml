name: CI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Expose the embedded Python runtime
        if: runner.os == 'Linux'
        run: |
          echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${pythonLocation}/lib" >> "$GITHUB_ENV"

      - name: Test agent plugin utilities
        run: |
          python -m unittest discover -s plugins/gaanim-dev/tests -v
          python -m unittest discover -s plugins/gaanim/tests -v

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Type-check workspace
        run: cargo check --workspace

      - name: Run unit tests
        run: cargo test --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets

  # Hosted Windows runners have no usable GPU adapter (wgpu crashes in the
  # driver), so everything that renders runs on Ubuntu with Mesa's software
  # Vulkan driver (lavapipe), the same setup that captured the baselines.
  visual-regression:
    name: Visual regression (Ubuntu, lavapipe)
    runs-on: ubuntu-24.04
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers xvfb libxkbcommon-x11-0

      - name: Expose the embedded Python runtime
        run: |
          echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${pythonLocation}/lib" >> "$GITHUB_ENV"

      - name: Build headless snapshot runner
        run: |
          cargo build -p gaanim_launcher --bin gaanim
          cargo build -p gaanim_editor --bin gaanim-core

      # Native 3D scenes open a window even for headless captures, hence Xvfb.
      - name: Validate public Scene examples
        run: xvfb-run -a pwsh ./tests/validate_scene_examples.ps1

      - name: Compare representative subsystem snapshots
        shell: xvfb-run -a bash -e {0}
        run: |
          examples=(
            transform_demo
            image_demo
            svg_demo
            camera_demo
            matrix_showcase
            chart_marks_gallery
            layout_reflow_demo
            equation_step
            primitives_3d_demo
            gltf_animation_demo
            vector_field_streamlines
            presentation_demo
          )
          hybrid=" chart_marks_gallery primitives_3d_demo gltf_animation_demo "
          for example in "${examples[@]}"; do
            if [[ "$hybrid" == *" $example "* ]]; then
              threshold=2 ratio=0.001
            else
              threshold=16 ratio=0.00001
            fi
            ./target/debug/gaanim --diff --example "examples/$example.py" --no-gui \
              --pixel-threshold "$threshold" --max-changed-ratio "$ratio"
          done

      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: representative-visual-diffs
          path: |
            tests/visual/**/current
            tests/visual/**/report
          if-no-files-found: warn
          retention-days: 14

  export-smoke:
    name: Export smoke (Ubuntu, lavapipe)
    runs-on: ubuntu-24.04
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers ffmpeg xvfb libxkbcommon-x11-0

      - name: Expose the embedded Python runtime
        run: |
          echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${pythonLocation}/lib" >> "$GITHUB_ENV"

      - name: Build executable runtime
        run: cargo build -p gaanim_editor --bin gaanim-core

      # The isolated 3D worker exports through a window, hence Xvfb.
      - name: Export formats and isolated 3D smoke
        run: xvfb-run -a python tests/validate_exports.py --output target/export-smoke

      - name: Upload export diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: export-smoke
          path: target/export-smoke
          if-no-files-found: warn
          retention-days: 14

  python-package:
    name: Python package (Ubuntu)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Expose the embedded Python runtime
        run: |
          echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${pythonLocation}/lib" >> "$GITHUB_ENV"

      - name: Build and install the authoring wheel
        run: |
          python -m pip install build hatchling
          python -m build --wheel --no-isolation --outdir dist crates/gaanim_python
          python tests/validate_authoring_wheel.py dist
          python -m pip install dist/*.whl

      - name: Validate the embedded Python API stub
        run: cargo run -p gaanim_editor --bin gaanim-core -- --validate-python-api tests/validate_python_api.py

  performance:
    name: Runtime performance (Ubuntu, informational)
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev \
            mesa-vulkan-drivers ffmpeg xvfb libxkbcommon-x11-0

      - name: Expose the embedded Python runtime
        run: |
          echo "PYO3_PYTHON=$(which python)" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${pythonLocation}/lib" >> "$GITHUB_ENV"

      - name: Build release runtime
        run: cargo build -p gaanim_editor --bin gaanim-core --release

      - name: Measure versioned runtime budgets
        run: xvfb-run -a python tests/benchmark_runtime.py --profile standard

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-performance-${{ github.run_id }}
          path: target/performance
          if-no-files-found: warn
          retention-days: 30
