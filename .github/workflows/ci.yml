name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # Typst, Bevy and Vello make a full workspace test build memory-intensive.
      # Keep hosted Windows runners below their paging-file limit.
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Test agent plugin utilities
        run: python -m unittest discover -s plugins/gaanim-dev/tests -v

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Type-check workspace
        run: cargo check --workspace

      - name: Run unit tests
        run: cargo test --workspace

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets

  visual-regression:
    name: Visual regression (Windows)
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Expose the embedded Python runtime
        shell: pwsh
        run: |
          $pythonHome = python -c "import sys; print(sys.base_prefix)"
          $pythonHome | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build headless snapshot runner
        run: cargo build -p gaanim_editor --bin gaanim

      - name: Validate public Scene examples
        shell: pwsh
        run: .\tests\validate_scene_examples.ps1

      - name: Compare representative subsystem snapshots
        shell: pwsh
        run: |
          $examples = @(
            "transform_demo",
            "image_demo",
            "svg_demo",
            "camera_demo",
            "matrix_showcase",
            "chart_marks_gallery",
            "layout_reflow_demo",
            "equation_step",
            "primitives_3d_demo",
            "gltf_animation_demo",
            "vector_field_streamlines",
            "presentation_demo"
          )
          $hybridExamples = @("chart_marks_gallery", "primitives_3d_demo", "gltf_animation_demo")
          foreach ($example in $examples) {
            $pixelThreshold = if ($hybridExamples -contains $example) { "2" } else { "16" }
            $maxChangedRatio = if ($hybridExamples -contains $example) { "0.001" } else { "0.00001" }
            .\target\debug\gaanim.exe --diff --example "examples\$example.py" --no-gui `
              --pixel-threshold $pixelThreshold --max-changed-ratio $maxChangedRatio
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload visual diff report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: representative-visual-diffs
          path: |
            tests/visual/**/current
            tests/visual/**/report
          if-no-files-found: warn
          retention-days: 14

  export-smoke:
    name: Export smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build executable runtime
        run: cargo build -p gaanim_editor --bin gaanim-core

      - name: Export and inspect all formats
        run: python tests/validate_exports.py --output target/export-smoke

      - name: Upload export diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: export-smoke-${{ matrix.os }}
          path: target/export-smoke
          if-no-files-found: warn
          retention-days: 14

  python-package:
    name: Python package (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and install the authoring wheel
        run: |
          python -m pip install build hatchling
          python -m build --wheel --no-isolation --outdir dist crates/gaanim_python
          python tests/validate_authoring_wheel.py dist
          python -m pip install dist/*.whl

      - name: Validate the embedded Python API stub
        run: cargo run -p gaanim_editor --bin gaanim-core -- --validate-python-api tests/validate_python_api.py
