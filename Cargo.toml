[workspace]
resolver = "2"
members = [
  "crates/gaanim_core",
  "crates/gaanim_expr",
  "crates/gaanim_math",
  "crates/gaanim_scene",
  "crates/gaanim_animation",
  "crates/gaanim_timeline",
  "crates/gaanim_media",
  "crates/gaanim_renderer",
  "crates/gaanim_objects",
  "crates/gaanim_layout",
  "crates/gaanim_visualization",
  "crates/gaanim_api",
  "crates/gaanim_text",
  "crates/gaanim_python",
  "crates/gaanim_editor",
  "crates/gaanim_export",
  "crates/gaanim_diff",
  "crates/gaanim_project",
  "crates/gaanim_launcher",
  "docs"
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[workspace.dependencies]
bevy = {version = "0.19.1", default-features = false, features = [
  "bevy_winit",       # windowing (not included by bevy_vello)
  "wayland",          # native windowing on Hyprland/Omarchy
  "multi_threaded",   # parallel execution
  "keyboard",         # KeyCode input
  "mouse",            # MouseButton input
  "default_font",     # font for egui
  "bevy_asset",
  "bevy_world_serialization",
  "bevy_gltf",
  "bevy_animation",
  "bevy_audio",
  "wav",              # registers Bevy's generic AudioSource asset
  "aac",
  "mp4",
  "symphonia-wav",    # decodes FFmpeg's streaming in-memory WAV output
  "gltf_animation",
  "bevy_pbr",
  "bevy_render",
  "hdr",
]}
thiserror = "2.0"
peniko = "0.6.1"
kurbo = "0.13.1"
glam = {version = "0.33.0", features = ["f64"]}
i_overlay = "7"
notify = { version = "8", default-features = false, features = ["macos_kqueue"] }
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
directories = "6.0"
gltf = { version = "1.4.1", features = ["import", "names", "utils", "extras", "extensions", "KHR_lights_punctual", "KHR_materials_transmission", "KHR_materials_ior", "KHR_materials_volume", "KHR_materials_unlit", "KHR_materials_emissive_strength", "KHR_texture_transform"] }
