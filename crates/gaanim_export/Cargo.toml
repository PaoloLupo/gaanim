[package]
name = "gaanim_export"
version = "0.2.0"
edition = "2024"
description = "State-of-the-art deterministic GPU-accelerated video/image/GIF export pipeline for gaanim"

[dependencies]
# Local workspace dependencies
gaanim_core = { path = "../gaanim_core" }
gaanim_math = { path = "../gaanim_math" }
gaanim_scene = { path = "../gaanim_scene" }
gaanim_animation = { path = "../gaanim_animation" }
gaanim_timeline = { path = "../gaanim_timeline" }
gaanim_media = { path = "../gaanim_media" }
gaanim_renderer = { path = "../gaanim_renderer" }
gaanim_text = { path = "../gaanim_text" }

# Third-party dependencies
# Export hosts use a native viewport, including the offscreen-window path.
bevy = { workspace = true, features = ["bevy_winit", "wayland"] }
glam = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
thiserror = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
bevy_vello = "0.14.0"
indicatif = "0.17"
pollster = "0.3"
crossbeam-channel = "0.5"

[features]
dev-dynamic = [
    "bevy/dynamic_linking",
    "gaanim_animation/dev-dynamic",
    "gaanim_math/dev-dynamic",
    "gaanim_media/dev-dynamic",
    "gaanim_renderer/dev-dynamic",
    "gaanim_scene/dev-dynamic",
    "gaanim_text/dev-dynamic",
    "gaanim_timeline/dev-dynamic",
]
