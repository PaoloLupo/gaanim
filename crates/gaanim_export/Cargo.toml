[package]
name = "gaanim_export"
version = "0.2.0"
edition = "2024"
description = "State-of-the-art deterministic GPU-accelerated video/image/GIF export pipeline for gaanim"

[dependencies]
# Local workspace dependencies
gaanim_core = { path = "../gaanim_core" }
gaanim_math = { path = "../gaanim_math" }
gaanim_scene = { path = "../gaanim_scene" }
gaanim_animation = { path = "../gaanim_animation" }
gaanim_timeline = { path = "../gaanim_timeline" }
gaanim_media = { path = "../gaanim_media" }
gaanim_renderer = { path = "../gaanim_renderer" }
gaanim_text = { path = "../gaanim_text" }

# Third-party dependencies
bevy = { workspace = true }
glam = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
thiserror = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
bevy_vello = "0.14.0"
indicatif = "0.17"
pollster = "0.3"
crossbeam-channel = "0.5"
