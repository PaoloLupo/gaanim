[package]
name = "gaanim_text"
version = "0.1.0"
edition = "2024"
description = "High-performance vector text outline parser, shaper, and LaTeX/Typst mathematical formula compiler for gaanim v2"

[dependencies]
# Local workspace dependencies
gaanim_core = { path = "../gaanim_core" }
gaanim_math = { path = "../gaanim_math" }
gaanim_scene = { path = "../gaanim_scene" }
gaanim_objects = { path = "../gaanim_objects" }

# Third-party dependencies from workspace
bevy = { workspace = true }
glam = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }

# Text shaping and parsing libraries
ttf-parser = "0.25"
rustybuzz = "0.20"
typst = "0.15.0"
typst-assets = { version = "0.15.0", features = ["fonts"] }
typst-kit = { version = "0.15.0", features = ["embedded-fonts", "scan-fonts", "system-packages", "universe-packages", "system-downloader"] }
typst-layout = "0.15.0"
fontdb = "0.23"
thiserror = "2.0"
unicode-segmentation = "1.12"

# Serialization (conditional)
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = [
    "dep:serde",
    "gaanim_core/serde",
    "gaanim_math/serde",
    "gaanim_scene/serde",
    "gaanim_objects/serde",
    "peniko/serde",
    "kurbo/serde",
    "glam/serde"
]
