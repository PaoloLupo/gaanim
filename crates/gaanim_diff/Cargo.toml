[package]
name = "gaanim_diff"
version = "0.4.1"
edition = "2024"
description = "Sparse seek snapshots and portable visual regression reports for gaanim"

[[bin]]
name = "gaanim-diff"
path = "src/main.rs"

[features]
dev-dynamic = [
    "gaanim_api/dev-dynamic",
    "gaanim_export/dev-dynamic",
    "gaanim_timeline/dev-dynamic",
]

[dependencies]
gaanim_api = { path = "../gaanim_api" }
gaanim_export = { path = "../gaanim_export" }
gaanim_timeline = { path = "../gaanim_timeline" }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
