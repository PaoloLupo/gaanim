[package]
name = "gaanim_layout"
version = "0.2.0"
edition = "2024"
description = "Mathematical relative coordinate layout and bounding box alignment tools for gaanim v2"

[dependencies]
# Local workspace dependencies
gaanim_core = { path = "../gaanim_core" }
gaanim_math = { path = "../gaanim_math" }
gaanim_scene = { path = "../gaanim_scene" }

# Third-party dependencies from workspace
glam = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
kasuari = "0.4.12"
thiserror = { workspace = true }

# Serialization (conditional)
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
dev-dynamic = [
    "gaanim_math/dev-dynamic",
    "gaanim_scene/dev-dynamic",
]
default = []
serde = [
    "dep:serde",
    "gaanim_core/serde",
    "gaanim_math/serde",
    "gaanim_scene/serde",
    "peniko/serde",
    "kurbo/serde",
    "glam/serde"
]
