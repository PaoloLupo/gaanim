[package]
name = "gaanim_python"
version = "0.1.0"
edition = "2021"

[lib]
name = "gaanim_python"
crate-type = ["rlib", "cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["abi3-py312", "py-clone"] }
gaanim_core = { path = "../gaanim_core" }
gaanim_api = { path = "../gaanim_api" }
gaanim_animation = { path = "../gaanim_animation" }
gaanim_math = { path = "../gaanim_math" }
gaanim_scene = { path = "../gaanim_scene" }
gaanim_diff = { path = "../gaanim_diff", default-features = false }
gaanim_timeline = { path = "../gaanim_timeline" }
