[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gaanim"
version = "0.1.0"
description = "Authoring helpers and type information for the Gaanim application"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
algebra = ["sympy>=1.14,<2"]

[tool.hatch.build.targets.wheel]
packages = ["gaanim"]
exclude = [
  "gaanim/__pycache__",
  "gaanim/**/*.pyc",
  "gaanim/**/*.so",
  "gaanim/**/*.pyd",
  "gaanim/**/*.dylib",
]
