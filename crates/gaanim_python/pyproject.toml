[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "gaanim"
version = "0.1.0"
description = "High-performance GPU-accelerated mathematical vector animation engine"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
algebra = ["sympy>=1.14,<2"]

[tool.maturin]
python-source = "."
module-name = "gaanim.gaanim_core"
include = ["gaanim/py.typed", "gaanim/gaanim_core.pyi"]
