<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animación Gaanim</title>
  <link rel="icon" href="../favicon.ico">
  <!-- The bindings and the module download with the page instead of after
       main.js imports them (scripts/build_web.py versions these addresses). -->
  <link rel="modulepreload" href="pkg/gaanim_embed.js">
  <link rel="preload" href="pkg/gaanim_embed_bg.wasm.gz" as="fetch" crossorigin>
  <style>
    /* Gaanim's identity (docs/assets/brand/README.md): graphite without a blue
       tint, violet for what came before, gold for the current frame, square
       corners, controls that step forward leaving two ghost frames. The page
       loads no font, to stay light. */
    :root {
      --ink: #121212;
      --text: #ededed;
      --muted: #a0a0a0;
      --primary: #a99fff;
      --primary-soft: rgba(169, 159, 255, 0.16);
      --violet: #7c6cff;
      --haze: #3f37a8;
      --gold: #ffc933;
      --danger: #f87171;
      --panel: rgba(18, 18, 18, 0.84);
      --line: rgba(255, 255, 255, 0.16);
      --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
      --frames: -3px 0 0 color-mix(in srgb, var(--primary) 45%, transparent),
        -6px 0 0 color-mix(in srgb, var(--primary) 20%, transparent);
      --frame-motion: 0.15s steps(3, end);
      --progress: 0%;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--ink); color: var(--text);
      font: 12px/1.4 var(--mono); -webkit-tap-highlight-color: transparent; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: manipulation; }
    [hidden] { display: none !important; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; border-radius: 0; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    /* Opening or failing: a line in the middle. */
    #message { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; text-align: center;
      color: var(--muted); pointer-events: none; }
    #message.error { color: var(--danger); pointer-events: auto; }
    #message.action { pointer-events: auto; cursor: pointer; }
    #message a { color: var(--primary); }
    /* Three frames light up in turn, from the faintest to the current one. */
    .loader { display: flex; justify-content: center; gap: 4px; margin-bottom: 10px; }
    .loader i { width: 8px; height: 8px; opacity: 0.25; animation: frame 0.9s steps(1, end) infinite; }
    .loader i:nth-child(1) { background: var(--haze); }
    .loader i:nth-child(2) { background: var(--violet); animation-delay: 0.3s; }
    .loader i:nth-child(3) { background: var(--gold); animation-delay: 0.6s; }
    @keyframes frame { 0%, 66% { opacity: 1; } 67%, 100% { opacity: 0.25; } }
    #fill { position: fixed; left: 0; bottom: 0; height: 2px; width: 0; background: var(--violet);
      transition: width .2s; pointer-events: none; }

    #big, #corner { background: var(--panel); border: 1px solid var(--line);
      transition: transform var(--frame-motion), box-shadow var(--frame-motion), border-color .12s; }
    /* Waiting for a first click (`autoplay=0`). */
    #big { position: fixed; left: 50%; top: 50%; translate: -50% -50%; width: 52px; height: 52px;
      display: grid; place-items: center; }
    /* At a stop or at the end: small, in a corner, so the frame stays in view. */
    #corner { position: fixed; right: 8px; top: 8px; display: flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; }
    #big:hover, #corner:hover { border-color: var(--primary); transform: translateX(3px); box-shadow: var(--frames); }
    #corner svg { color: var(--gold); }

    /* The bar shows while the pointer moves over the animation, or after a tap. */
    #bar { position: fixed; left: 6px; right: 6px; bottom: 6px; display: flex; align-items: center; gap: 6px;
      padding: 3px 6px; background: var(--panel); border: 1px solid var(--line); opacity: 0; transition: opacity .2s; }
    body.reveal #bar, #bar:focus-within { opacity: 1; }
    #bar button { width: 28px; height: 28px; display: grid; place-items: center; flex: none; }
    #bar button:hover { background: var(--primary-soft); color: var(--primary); }
    #bar button[aria-pressed="false"] { color: var(--muted); }
    #bar button[aria-pressed="true"] { color: var(--primary); }
    /* The timeline: what played in violet, the current frame a gold square. */
    #track { position: relative; flex: 1; min-width: 40px; display: flex; align-items: center; }
    #seek { flex: 1; min-width: 0; height: 20px; margin: 0; background: transparent; appearance: none; cursor: pointer; }
    /* The stops (scene.stop()): ticks across the track, where the thumb's
       center sits at their time; violet once passed, as the progress is. */
    #stops { position: absolute; left: 0; right: 0; top: 50%; pointer-events: none; }
    #stops i { position: absolute; top: -4px; width: 2px; height: 8px; margin-left: -1px;
      left: calc(4.5px + (100% - 9px) * var(--at)); background: rgba(255,255,255,.7); }
    #stops i.passed { background: var(--violet); }
    #seek::-webkit-slider-runnable-track { height: 3px; background: linear-gradient(to right, var(--violet) var(--progress), rgba(255,255,255,.18) var(--progress)); }
    #seek::-moz-range-track { height: 3px; background: linear-gradient(to right, var(--violet) var(--progress), rgba(255,255,255,.18) var(--progress)); }
    #seek::-webkit-slider-thumb { appearance: none; width: 9px; height: 9px; margin-top: -3px; background: var(--gold); border: 0; border-radius: 0; }
    #seek::-moz-range-thumb { width: 9px; height: 9px; background: var(--gold); border: 0; border-radius: 0; }
    #clock { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    @media (max-width: 300px) { #clock { display: none; } }
    #sound-hint { position: fixed; left: 8px; top: 8px; padding: 4px 10px; background: var(--panel);
      border: 1px solid var(--line); color: var(--muted); pointer-events: none; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; animation: none !important; }
      #big:hover, #corner:hover { transform: none; }
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="Animación"></canvas>
  <div id="message" role="status"><div><div class="loader" aria-hidden="true"><i></i><i></i><i></i></div><span id="message-text">Cargando…</span></div></div>
  <div id="fill" hidden></div>
  <button type="button" id="big" aria-label="Reproducir" hidden>
    <svg id="big-icon" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
  </button>
  <button type="button" id="corner" hidden>
    <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path id="corner-icon" d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
    <span id="corner-text">Continuar</span>
  </button>
  <div id="sound-hint" hidden>Toca la animación para oír el sonido</div>
  <div id="bar" hidden>
    <button type="button" id="toggle" aria-label="Reproducir">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path id="toggle-icon" d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
    </button>
    <div id="track">
      <input type="range" id="seek" min="0" max="1" step="any" value="0" aria-label="Posición">
      <div id="stops" aria-hidden="true"></div>
    </div>
    <span id="clock">0:00 / 0:00</span>
    <button type="button" id="loop" aria-label="Repetir en bucle" aria-pressed="false" title="Repetir en bucle">
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M3 7.5V6.5A2.5 2.5 0 0 1 5.5 4H12M10 2l2 2-2 2M13 8.5v1A2.5 2.5 0 0 1 10.5 12H4M6 14l-2-2 2-2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" id="mute" aria-label="Silenciar" hidden>
      <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path id="mute-waves" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.5 3.5a6 6 0 0 1 0 9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <button type="button" id="fullscreen" aria-label="Pantalla completa">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
