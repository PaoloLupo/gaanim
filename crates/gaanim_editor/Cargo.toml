[package]
name = "gaanim_editor"
version = "0.7.1"
license = "MIT OR Apache-2.0"
edition = "2024"
description = "Gaanim application: interactive viewer with hot-reload of animation scripts"

[lib]
name = "gaanim_editor"
path = "src/lib.rs"

[dependencies]
gaanim_core = { path = "../gaanim_core" }
gaanim_math = { path = "../gaanim_math" }
gaanim_scene = { path = "../gaanim_scene" }
gaanim_api = { path = "../gaanim_api" }
gaanim_bundle = { path = "../gaanim_bundle" }
gaanim_animation = { path = "../gaanim_animation" }
gaanim_timeline = { path = "../gaanim_timeline" }
gaanim_media = { path = "../gaanim_media" }
gaanim_export = { path = "../gaanim_export" }
gaanim_diff = { path = "../gaanim_diff" }
gaanim_renderer = { path = "../gaanim_renderer" }
gaanim_text = { path = "../gaanim_text" }
gaanim_project = { path = "../gaanim_project" }

bevy = { workspace = true, features = [
    "bevy_winit",
    "wayland",      # native windowing on Hyprland/Omarchy
    "keyboard",
    "mouse",
    "touch",        # phones and tablets (web player), touchscreens
] }
glam = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
# Scenes of the web Presenter View's cue previews.
vello = "0.9.0"
bevy_egui = { version = "0.42.0", default-features = false, features = ["render", "manage_clipboard", "default_fonts"] }
# Same winit as bevy_winit; only its `Icon` type is used, for the window icon.
winit = { version = "0.30", default-features = false }
notify = { workspace = true }
crossbeam-channel = { workspace = true }
chrono = { version = "0.4.44", default-features = false, features = ["clock"] }
rfd = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
# Microphone capture for narration takes; the same build Bevy's audio uses.
cpal = { version = "0.17", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
open = "5.3"

# The presenter's clock reads the browser's local time on the web.
[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4.44", default-features = false, features = ["clock", "wasmbind"] }

[dev-dependencies]
tempfile = "3"

[features]
dev-dynamic = [
    "bevy/dynamic_linking",
    "gaanim_animation/dev-dynamic",
    "gaanim_api/dev-dynamic",
    "gaanim_bundle/dev-dynamic",
    "gaanim_diff/dev-dynamic",
    "gaanim_export/dev-dynamic",
    "gaanim_math/dev-dynamic",
    "gaanim_media/dev-dynamic",
    "gaanim_renderer/dev-dynamic",
    "gaanim_scene/dev-dynamic",
    "gaanim_text/dev-dynamic",
    "gaanim_timeline/dev-dynamic",
]
