[package]
name = "gaanim_objects"
version = "0.16.0"
license = "MIT OR Apache-2.0"
edition = "2024"
description = "High-level visual shapes, vector primitives, and text render components for gaanim v2"

[dependencies]
# Local workspace dependencies
gaanim_core = { path = "../gaanim_core" }
gaanim_math = { path = "../gaanim_math" }
gaanim_scene = { path = "../gaanim_scene" }

# Third-party dependencies from workspace
bevy = { workspace = true }
glam = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
thiserror = { workspace = true }
i_overlay = { workspace = true }
usvg = { version = "0.47", default-features = false, features = ["text", "system-fonts"] }
# glTF 2.0 models: the document, its buffers and accessors. Images are
# decoded here with `image`, and only those a material shows.
gltf = { version = "1.4", default-features = false, features = [
    "import",
    "names",
    "utils",
    "KHR_materials_unlit",
    "KHR_materials_emissive_strength",
] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
base64 = "0.22"
tracing = { workspace = true }

# Serialization: the character catalog is JSON; the `serde` feature also
# derives it for the other types.
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }

[features]
dev-dynamic = [
    "bevy/dynamic_linking",
    "gaanim_math/dev-dynamic",
    "gaanim_scene/dev-dynamic",
]
default = []
serde = [
    "gaanim_core/serde",
    "gaanim_math/serde",
    "gaanim_scene/serde",
    "peniko/serde",
    "kurbo/serde",
    "glam/serde"
]
