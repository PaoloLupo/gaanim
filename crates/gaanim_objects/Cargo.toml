[package]
name = "gaanim_objects"
version = "0.3.0"
edition = "2024"
description = "High-level visual shapes, vector primitives, and text render components for gaanim v2"

[dependencies]
# Local workspace dependencies
gaanim_core = { path = "../gaanim_core" }
gaanim_math = { path = "../gaanim_math" }
gaanim_scene = { path = "../gaanim_scene" }

# Third-party dependencies from workspace
bevy = { workspace = true }
glam = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
thiserror = { workspace = true }
i_overlay = { workspace = true }
usvg = { version = "0.47", default-features = false }

# Serialization (conditional)
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = [
    "dep:serde",
    "gaanim_core/serde",
    "gaanim_math/serde",
    "gaanim_scene/serde",
    "peniko/serde",
    "kurbo/serde",
    "glam/serde"
]
