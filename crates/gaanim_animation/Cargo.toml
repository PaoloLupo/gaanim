[package]
name = "gaanim_animation"
version = "0.7.2"
license = "MIT OR Apache-2.0"
edition = "2024"
description = "Tween systems, interpolation lenses, keyframes, and reactive signals for gaanim v2"

[dependencies]
# Local workspace dependencies
gaanim_core = { path = "../gaanim_core" }
gaanim_math = { path = "../gaanim_math" }
gaanim_objects = { path = "../gaanim_objects" }
gaanim_scene = { path = "../gaanim_scene" }
gaanim_text = { path = "../gaanim_text" }

# Re-use workspace dependencies
bevy = { workspace = true }
glam = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
thiserror = { workspace = true }
# Live zones travel in bundles as JSON; the `serde` feature also derives the
# other types.
serde = { version = "1.0", features = ["derive"] }

[features]
dev-dynamic = [
    "bevy/dynamic_linking",
    "gaanim_math/dev-dynamic",
    "gaanim_objects/dev-dynamic",
    "gaanim_scene/dev-dynamic",
    "gaanim_text/dev-dynamic",
]
default = []
serde = [
    "gaanim_core/serde",
    "gaanim_math/serde",
    "gaanim_scene/serde",
    "peniko/serde",
    "kurbo/serde"
]
