[package]
name = "gaanim_renderer"
version = "0.10.1"
license = "MIT OR Apache-2.0"
edition = "2024"
description = "Vello GPU 2D vector renderer, Fragment Retain caching, wgpu integrations, and effects for gaanim v2"

[dependencies]
# Local workspace dependencies
gaanim_core = { path = "../gaanim_core" }
gaanim_math = { path = "../gaanim_math" }
gaanim_scene = { path = "../gaanim_scene" }
gaanim_animation = { path = "../gaanim_animation" }
gaanim_objects = { path = "../gaanim_objects" }

# Third-party dependencies from workspace
bevy = { workspace = true }
glam = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Graphics & GPU dependencies
vello = { version = "0.9.0" }
# Patched in vendor/vello_encoding; compared to skip unchanged canvas frames.
vello_encoding = "0.9.0"
velato = { git = "https://github.com/PaoloLupo/velato", rev = "69d9647389f7e47ce7329ab52949d335eef4a41e", default-features = false, features = ["vello"] }
naga = { version = "29.0.0", features = ["wgsl-in"] }
pollster = "0.4"

# Serialization (conditional)
serde = { version = "1.0", features = ["derive"], optional = true }

# The playground's Pyodide extension (wasm32-unknown-emscripten) only captures
# frames on the CPU; Bevy's render subsystems enable `bevy_app/web` on wasm32,
# whose wasm-bindgen glue Pyodide cannot load.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
bevy = { workspace = true, features = [
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_render",
    "bevy_window",
    "hdr",
] }

# Without Bevy's renderer, which sets it on wasm32, Vello's wgpu resources are
# not Send without threads; the extension runs on one thread.
[target.'cfg(target_os = "emscripten")'.dependencies]
wgpu = { version = "29", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }

[features]
dev-dynamic = [
    "bevy/dynamic_linking",
    "gaanim_animation/dev-dynamic",
    "gaanim_math/dev-dynamic",
    "gaanim_objects/dev-dynamic",
    "gaanim_scene/dev-dynamic",
]
default = []
serde = [
    "dep:serde",
    "gaanim_core/serde",
    "gaanim_math/serde",
    "gaanim_scene/serde",
    "peniko/serde",
    "kurbo/serde",
    "glam/serde"
]
