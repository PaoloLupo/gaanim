<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reproductor Gaanim</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root {
      --ink: #0f1015;
      --surface: #16171e;
      --text: #eceef3;
      --muted: #9499a6;
      --faint: #5c616e;
      --accent: #70aaff;
      --loop: #60ce98;
      --danger: #ff7676;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden;
      overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    #stage { position: fixed; inset: 0; }
    /* The player handles every gesture on the canvas (taps, double taps,
       swipes, dragging the seek bar); the browser must not scroll or zoom. */
    #gaanim-canvas { display: block; width: 100%; height: 100%; outline: none;
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-touch-callout: none; }
    #welcome { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px;
      background: var(--ink); }
    #welcome[hidden] { display: none; }
    .card { width: min(560px, 100%); text-align: center; }
    .card img { width: 64px; height: 64px; image-rendering: pixelated; }
    h1 { font-size: 24px; font-weight: 500; margin: 16px 0 4px; }
    p { color: var(--muted); margin: 0 0 20px; }
    .drop { display: block; border: 1px dashed rgba(255,255,255,.18); padding: 32px 16px; cursor: pointer;
      background: var(--surface); transition: border-color .15s, background .15s; }
    .drop.over, .drop:hover { border-color: var(--loop); background: #1b1c24; }
    .drop strong { display: block; font-weight: 500; }
    .drop span { color: var(--faint); font-size: 13px; }
    button { font: inherit; color: #0f1015; background: var(--accent); border: 0; padding: 8px 16px;
      margin-top: 14px; cursor: pointer; }
    #status { min-height: 1.5em; margin-top: 16px; font-size: 13px; color: var(--muted); }
    #status.error { color: var(--danger); }
    .links { margin: 20px 0 0; font-size: 13px; }
    .links a { color: var(--accent); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    progress { width: 100%; height: 4px; margin-top: 12px; appearance: none; border: 0; background: #262833; }
    progress::-webkit-progress-bar { background: #262833; }
    progress::-webkit-progress-value { background: var(--loop); }
    progress::-moz-progress-bar { background: var(--loop); }
    progress[hidden] { display: none; }
    #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      width: max-content; max-width: calc(100% - 32px); padding: 10px 16px;
      background: var(--surface); border: 1px solid rgba(255,255,255,.12); color: var(--text);
      font-size: 14px; z-index: 10; }
    #toast[hidden] { display: none; }
    /* Wording for mouse or touch screens. */
    .drop strong.touch, .drop span.touch { display: none; }
    @media (pointer: coarse) {
      .drop strong.mouse, .drop span.mouse { display: none; }
      .drop strong.touch { display: block; }
      .drop { padding: 40px 16px; }
    }
  </style>
</head>
<body>
  <div id="stage"><canvas id="gaanim-canvas" tabindex="0"></canvas></div>
  <div id="welcome">
    <div class="card">
      <img src="gaanim-icon-512.png" alt="">
      <h1>Reproductor Gaanim</h1>
      <p>Reproduce y presenta archivos <code>.gaanim</code> en el navegador.</p>
      <label class="drop" id="drop">
        <strong class="mouse">Suelta aquí un archivo .gaanim</strong>
        <strong class="touch">Toca para elegir un archivo .gaanim</strong>
        <span><span class="mouse">o haz clic para elegirlo. </span>El archivo no sale de tu equipo.</span>
        <!-- No accept filter: iOS greys out files of unknown types. -->
        <input type="file" id="file" hidden>
      </label>
      <progress id="progress" max="1" value="0" hidden></progress>
      <div id="status" role="status"></div>
      <p class="links"><a href="../">Documentación de Gaanim</a> · <a href="../guias/compartir/">Cómo compartir un .gaanim</a></p>
    </div>
  </div>
  <div id="toast" role="status" hidden></div>
  <script type="module" src="main.js"></script>
</body>
</html>
