[package]
name = "gaanim_math"
version = "0.1.0"
edition = "2024"
description = "Spatial transforms, bounding boxes, camera systems, and easing functions for gaanim v2"

[dependencies]
# Local workspace dependency
gaanim_core = { path = "../gaanim_core" }

# Re-use workspace dependencies
bevy = { workspace = true }
glam = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
dim3 = []
serde = ["dep:serde", "gaanim_core/serde", "glam/serde", "kurbo/serde", "peniko/serde"]
