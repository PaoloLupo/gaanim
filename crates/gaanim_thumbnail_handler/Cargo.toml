[package]
name = "gaanim_thumbnail_handler"
version = "0.6.2"
license = "MIT OR Apache-2.0"
edition = "2024"
description = "Windows Explorer thumbnail handler that shows the cover image of .gaanim files"

[lib]
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
gaanim_thumbnail = { path = "../gaanim_thumbnail" }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"
