[package]
name = "gaanim_launcher"
version = "0.6.0"
license = "MIT OR Apache-2.0"
edition = "2024"
description = "Launcher for gaanim that sets up Python PATH before spawning gaanim-core"

[[bin]]
name = "gaanim"
path = "src/main.rs"

[dependencies]
gaanim_core = { path = "../gaanim_core" }
gaanim_project = { path = "../gaanim_project" }
