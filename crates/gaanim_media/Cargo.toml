[package]
name = "gaanim_media"
version = "0.3.0"
edition = "2024"
description = "Timeline-synchronized video and embedded-audio playback for gaanim"

[dependencies]
gaanim_core = { path = "../gaanim_core" }
gaanim_scene = { path = "../gaanim_scene" }
gaanim_timeline = { path = "../gaanim_timeline" }
bevy = { workspace = true, features = [
    "bevy_audio",
    "wav",           # registers Bevy's generic AudioSource asset
    "aac",
    "mp4",
    "symphonia-wav", # decodes FFmpeg's streaming in-memory WAV output
] }
crossbeam-channel = { workspace = true }
# Already built for Bevy's WAV support; reads and writes narration takes.
hound = "3.5"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[features]
dev-dynamic = [
    "bevy/dynamic_linking",
    "gaanim_scene/dev-dynamic",
    "gaanim_timeline/dev-dynamic",
]
