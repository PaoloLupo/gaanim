[package]
name = "gaanim_scene"
version = "0.10.1"
license = "MIT OR Apache-2.0"
edition = "2024"
description = "ECS Scene graph, mobject components, and hierarchical propagation systems for gaanim v2"

[dependencies]
# Local workspace dependencies
gaanim_core = { path = "../gaanim_core" }
gaanim_math = { path = "../gaanim_math" }

# Re-use workspace dependencies
# Colors and input types build on every target, the playground's Pyodide
# extension included (see below).
bevy = { workspace = true, features = ["async_executor", "bevy_color", "keyboard", "mouse"] }
glam = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"], optional = true }

# The playground's Pyodide extension (wasm32-unknown-emscripten) records scenes
# without assets, logging or rendering: on wasm32 these Bevy subsystems enable
# `bevy_app/web`, whose wasm-bindgen glue Pyodide cannot load.
[target.'cfg(not(target_os = "emscripten"))'.dependencies]
bevy = { workspace = true, features = [
    "bevy_asset",
    "bevy_log",
    "bevy_render",
] }

[features]
dev-dynamic = [
    "bevy/dynamic_linking",
    "gaanim_math/dev-dynamic",
]
default = []
serde = ["dep:serde", "gaanim_core/serde", "gaanim_math/serde", "peniko/serde", "kurbo/serde"]
