[package]
name = "gaanim_scene"
version = "0.4.1"
edition = "2024"
description = "ECS Scene graph, mobject components, and hierarchical propagation systems for gaanim v2"

[dependencies]
# Local workspace dependencies
gaanim_core = { path = "../gaanim_core" }
gaanim_math = { path = "../gaanim_math" }

# Re-use workspace dependencies
# Scene components and systems own glTF instances, materials, and 3D meshes.
# glTF textures decode through `png`; glTF scenes instantiate by reflection.
bevy = { workspace = true, features = [
    "async_executor",
    "bevy_asset",
    "bevy_log",
    "bevy_world_serialization",
    "bevy_gltf",
    "bevy_animation",
    "gltf_animation",
    "bevy_pbr",
    "bevy_render",
    "png",
    "reflect_auto_register",
] }
glam = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
thiserror = { workspace = true }
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
dev-dynamic = [
    "bevy/dynamic_linking",
    "gaanim_math/dev-dynamic",
]
default = []
serde = ["dep:serde", "gaanim_core/serde", "gaanim_math/serde", "peniko/serde", "kurbo/serde"]
