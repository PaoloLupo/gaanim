<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="noindex" />
    <title>Gaanim · Votar</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/i18n.js" defer></script>
    <script src="/join.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="bar">
        <a class="brand" href="/">
          <img class="symbol symbol-dark" src="/symbol-dark.svg" alt="" width="36" height="24" />
          <img class="symbol symbol-light" src="/symbol-light.svg" alt="" width="36" height="24" />
          <span class="wordmark">Gaanim</span>
        </a>
      </header>

      <section class="center">
        <h1 data-t="joinTitle">Únete a la presentación</h1>
        <p data-t="joinHint">Escribe el código que aparece en la pantalla.</p>
        <form class="join" id="join" novalidate>
          <label class="sr-only" for="code" data-t="codeLabel">Código</label>
          <input
            id="code"
            class="code-input"
            name="code"
            inputmode="text"
            autocomplete="off"
            autocapitalize="characters"
            autocorrect="off"
            spellcheck="false"
            maxlength="6"
            placeholder="ABC234"
            enterkeyhint="go"
            aria-describedby="join-error"
            required
          />
          <button class="primary" id="go" type="submit" disabled data-t="joinButton">
            Entrar
          </button>
          <p class="error" id="join-error" role="alert"></p>
        </form>
        <p class="hint" data-t="scanHint">¿Tienes el QR? Escanéalo con la cámara.</p>
      </section>
    </main>
  </body>
</html>
