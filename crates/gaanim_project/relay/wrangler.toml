# Gaanim relay: carries audience votes from phones to a Gaanim presentation.
name = "gaanim-relay"
main = "src/index.js"
compatibility_date = "2026-09-30"

# Logs and traces, sampled: every phone message is an invocation, so a full
# room does not use up the plan's daily log events.
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

# The join and voting pages. A request for a file is served from here
# without running the Worker; everything else (/s/<code>, the API) runs it.
[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "SESSIONS"
class_name = "PollSession"

# SQLite-backed Durable Objects are available on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PollSession"]

# A separate test deployment: `npm run deploy:test` publishes
# gaanim-relay-test.<account>.workers.dev with its own sessions.
[env.test]
name = "gaanim-relay-test"

[env.test.assets]
directory = "./public"
binding = "ASSETS"

[[env.test.durable_objects.bindings]]
name = "SESSIONS"
class_name = "PollSession"
