[package]
name = "gaanim_timeline"
version = "0.1.0"
edition = "2024"
description = "Timeline resource, event-sourced seek, snapshots, presentation slides, and audio synchronization for gaanim v2"

[dependencies]
# Local workspace dependencies
gaanim_core = { path = "../gaanim_core" }
gaanim_math = { path = "../gaanim_math" }
gaanim_scene = { path = "../gaanim_scene" }
gaanim_animation = { path = "../gaanim_animation" }

# Third-party dependencies from workspace / registry
bevy = { workspace = true }
glam = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
thiserror = { workspace = true }

# Timeline-specific dependencies
slotmap = { version = "1.1" }
ordered-float = { version = "5.3" }

# Serialization (conditional)
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = [
    "dep:serde",
    "gaanim_core/serde",
    "gaanim_math/serde",
    "gaanim_scene/serde",
    "gaanim_animation/serde",
    "peniko/serde",
    "kurbo/serde",
    "glam/serde",
    "slotmap/serde",
    "ordered-float/serde"
]

[dev-dependencies]
gaanim_renderer = { path = "../gaanim_renderer" }
gaanim_objects = { path = "../gaanim_objects" }


