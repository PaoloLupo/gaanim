<svg width="360" height="220" viewBox="0 0 360 220" xmlns="http://www.w3.org/2000/svg">
  <style>
    .frame { fill: url(#panel); stroke: #d5e6ff; stroke-width: 5; }
    .accent { fill: #f9c74f; stroke: #ffffff; stroke-width: 4; }
  </style>
  <defs>
    <path id="spark" d="M0,-24 L6,-6 L24,0 L6,6 L0,24 L-6,6 L-24,0 L-6,-6 Z"/>
    <linearGradient id="panel" gradientUnits="userSpaceOnUse" x1="30" y1="28" x2="330" y2="192">
      <stop offset="0" stop-color="#0f2b50"/>
      <stop offset=".55" stop-color="#173b69"/>
      <stop offset="1" stop-color="#341c59"/>
    </linearGradient>
    <radialGradient id="orb-gradient" gradientUnits="userSpaceOnUse" cx="108" cy="110" r="44" fx="94" fy="96">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset=".55" stop-color="#f9c74f"/>
      <stop offset="1" stop-color="#f97316"/>
    </radialGradient>
    <clipPath id="rounded-card">
      <rect x="30" y="28" width="300" height="164" rx="22"/>
    </clipPath>
    <filter id="soft-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#020617" flood-opacity=".65"/>
    </filter>
  </defs>
  <g id="shadowed-card" filter="url(#soft-shadow)">
    <rect class="frame" x="30" y="28" width="300" height="164" rx="22"/>
  </g>
  <g id="card" clip-path="url(#rounded-card)" transform="translate(180 110)">
    <rect class="frame" x="-150" y="-82" width="300" height="164" rx="22"/>
    <circle id="orb" cx="-72" cy="0" r="40" fill="url(#orb-gradient)" stroke="#ffffff" stroke-width="4"/>
    <path id="play" fill="#48cae4" stroke="#ffffff" stroke-width="4" d="M-18,-38 L72,0 L-18,38 Z"/>
    <g id="spark-top" transform="translate(106 -50) scale(.56)" opacity=".92">
      <use href="#spark" fill="#f72585" stroke="#ffffff" stroke-width="5"/>
    </g>
    <g id="spark-bottom" transform="translate(106 50) scale(.38)">
      <use href="#spark" fill="#90be6d" stroke="#ffffff" stroke-width="7"/>
    </g>
    <text id="svg-label" x="-18" y="60" font-family="DejaVu Sans, sans-serif" font-size="18"
          font-weight="700" fill="#f8fafc">VECTOR SVG</text>
  </g>
</svg>
