[package]
name = "docs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
typst-kit = { git = "https://github.com/typst/typst", features = ["http-server", "datetime", "timer", "emit-diagnostics", "bundle", "watcher"] }
typst = { git = "https://github.com/typst/typst" }
typst-utils = { git = "https://github.com/typst/typst" }
typst-library = { git = "https://github.com/typst/typst" }
typst-html = { git = "https://github.com/typst/typst" }
typst-svg = { git = "https://github.com/typst/typst" }
typst-bundle = { git = "https://github.com/typst/typst" }
typst-assets = { git = "https://github.com/typst/typst-assets", features = ["fonts"] }
open = "5.3.5"
rayon = "1.12.0"
anyhow = "1.0.102"
base64 = "0.22.1"
az = "1.3.0"
ecow = "0.2.6"
serde_json = "1"
