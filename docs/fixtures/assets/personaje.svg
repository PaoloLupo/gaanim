<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- Each part has an id, as Inkscape writes it from Object Properties. -->
  <!-- Arms are drawn at rest pointing along x, from the shoulder outward. -->
  <g id="piernas" fill="#1e3a8a">
    <rect x="168" y="240" width="26" height="50" rx="10"/>
    <rect x="206" y="240" width="26" height="50" rx="10"/>
  </g>
  <rect id="torso" x="160" y="140" width="80" height="110" rx="22" fill="#3b82f6"/>
  <!-- One path per arm: the hand and the arm turn as one piece. -->
  <path id="brazo-izq" fill="#fcd34d"
        d="M 89 150 H 155 A 9 9 0 0 1 155 168 H 89 A 9 9 0 0 1 89 150 Z
           M 62 159 A 12 12 0 1 1 86 159 A 12 12 0 1 1 62 159 Z"/>
  <path id="brazo-der" fill="#fcd34d"
        d="M 245 150 H 311 A 9 9 0 0 1 311 168 H 245 A 9 9 0 0 1 245 150 Z
           M 314 159 A 12 12 0 1 1 338 159 A 12 12 0 1 1 314 159 Z"/>
  <g id="cabeza">
    <circle id="cara" cx="200" cy="95" r="45" fill="#fcd34d"/>
    <g id="ojos" fill="#1e293b">
      <circle cx="185" cy="90" r="5"/>
      <circle cx="215" cy="90" r="5"/>
    </g>
    <g id="cejas" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round">
      <path d="M 175 76 L 192 73"/>
      <path d="M 208 73 L 225 76"/>
    </g>
    <path id="nariz" d="M 200 92 Q 207 104 199 106" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
    <path id="boca" d="M 186 117 Q 200 128 214 117" fill="none" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
